version: "3.9"

services:
  vera-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vera-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
    volumes:
      - ./cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
